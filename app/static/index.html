<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지?</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
</head>
<body>
<header class="topbar">
  <h1>🍚 오늘 뭐 먹지?</h1>
  <p class="sub" id="subtitle">회사 주변 식당을 랜덤으로 골라 드립니다.</p>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="pick">추천</button>
    <button class="tab" data-tab="history">기록</button>
    <button class="tab" data-tab="places">식당 목록</button>
    <button class="tab" data-tab="admin">설정</button>
  </nav>
</header>

<main>
  <!-- 추천 -->
  <section class="panel active" id="panel-pick">
    <div class="pick-actions">
      <button id="draw" class="primary big">오늘의 점심 뽑기</button>
      <label class="inline">
        반경
        <select id="radius-quick">
          <option value="300">300m</option>
          <option value="500" selected>500m</option>
          <option value="800">800m</option>
          <option value="1200">1.2km</option>
        </select>
      </label>
      <label class="inline">
        개수
        <select id="count-quick">
          <option value="2">2곳</option>
          <option value="3" selected>3곳</option>
          <option value="4">4곳</option>
          <option value="5">5곳</option>
        </select>
      </label>
    </div>
    <p class="note" id="pick-note"></p>
    <div id="cards" class="cards"></div>
  </section>

  <!-- 기록 -->
  <section class="panel" id="panel-history">
    <p class="hint">지난 추천 기록입니다. 다녀온 곳에 별점을 남기면 다음 추천에 반영됩니다.</p>
    <div id="history" class="history"></div>
  </section>

  <!-- 식당 목록 -->
  <section class="panel" id="panel-places">
    <div class="toolbar">
      <input type="search" id="place-search" placeholder="상호·분류 검색">
      <label class="inline"><input type="checkbox" id="show-blocked"> 제외된 곳도 보기</label>
      <span class="spacer"></span>
      <span class="muted" id="place-count"></span>
    </div>
    <div id="places" class="places"></div>
  </section>

  <!-- 설정 -->
  <section class="panel" id="panel-admin">
    <div class="card block">
      <h3>회사 위치 · 추천 설정</h3>
      <div class="grid2">
        <label>회사 이름<input id="cfg-office-name" type="text"></label>
        <label>지역 키워드 <span class="tip" title="수집할 때 쓰는 검색어입니다. 예: 역삼동, 판교역">?</span><input id="cfg-area" type="text" placeholder="예: 역삼동"></label>
        <label>위도<input id="cfg-lat" type="number" step="0.0000001"></label>
        <label>경도<input id="cfg-lng" type="number" step="0.0000001"></label>
        <label>반경(m)<input id="cfg-radius" type="number" min="100" step="50"></label>
        <label>추천 개수<input id="cfg-count" type="number" min="1" max="6"></label>
      </div>
      <button id="cfg-save" class="primary">저장</button>
      <span class="muted" id="cfg-saved"></span>
    </div>

    <div class="card block">
      <h3>식당 수집</h3>
      <p class="hint">네이버 지역검색으로 지역 키워드 주변 식당을 모읍니다. 반경 밖은 자동으로 걸러집니다.</p>
      <div class="row">
        <button id="run-sync" class="primary">주변 식당 수집</button>
        <button id="run-enrich">리뷰 지표 채우기</button>
      </div>
      <div class="progress" id="sync-progress" hidden>
        <div class="bar"><span id="sync-bar"></span></div>
        <p class="muted" id="sync-msg"></p>
      </div>
      <p class="warn" id="sync-warn" hidden></p>
    </div>

    <div class="card block">
      <h3>직접 추가</h3>
      <div class="grid2">
        <label>상호명<input id="add-name" type="text" placeholder="단골 백반집"></label>
        <label>주소<input id="add-addr" type="text" placeholder="서울 강남구 ..."></label>
        <label>분류<input id="add-cat" type="text" placeholder="음식점&gt;한식&gt;백반"></label>
        <label>위도,경도<input id="add-coord" type="text" placeholder="37.4979,127.0276"></label>
      </div>
      <button id="add-place" class="primary">추가</button>
      <span class="muted" id="add-msg"></span>
    </div>

    <div class="card block">
      <h3>제외 목록 <span class="muted" id="block-count"></span></h3>
      <p class="hint">'다시 안 보기'로 뺀 식당입니다. 되돌리면 다시 추천에 나옵니다.</p>
      <div id="blocks" class="blocks"></div>
    </div>

    <div class="card block">
      <h3>현황</h3>
      <div id="stats" class="stats"></div>
    </div>
  </section>
</main>

<!-- 별점 모달 -->
<div class="modal" id="rate-modal" hidden>
  <div class="modal-box">
    <h3 id="rate-title">별점 남기기</h3>
    <label>이름<input id="rate-name" type="text" placeholder="닉네임"></label>
    <div class="stars" id="rate-stars">
      <button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button>
      <button data-v="4">★</button><button data-v="5">★</button>
    </div>
    <label>한줄평<input id="rate-comment" type="text" placeholder="선택"></label>
    <div id="rate-existing" class="existing"></div>
    <div class="row end">
      <button id="rate-cancel">취소</button>
      <button id="rate-save" class="primary">저장</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
